[build-system]
build-backend = "uv_build"

requires = [ "uv-build>=0.8.19,<0.9" ]

[project]
name = "openhands-ai"
version = "0.56.0"
description = "OpenHands: Code Less, Make More"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "OpenHands" } ]
requires-python = ">=3.12,<3.14"

classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Core runtime dependencies. Kept as a list for readability; uv and other tools will read them from [project].dependencies.
dependencies = [
  "aiohttp>=3.9,!=3.11.13",
  "anthropic[vertex]",
  "anyio>=4.9",
  "bashlex>=0.18",
  "boto3",
  "browsergym-core==0.13.3",
  "deprecated",
  "dirhash",
  "docker",
  "fastapi",
  "fastmcp>=2.5.2",
  "google-api-python-client>=2.164",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "google-cloud-aiplatform",
  "google-genai",
  "html2text",
  "httpx-aiohttp>=0.1.8",
  "jinja2>=3.1.3",
  "joblib",
  "json-repair",
  "jupyter-kernel-gateway",
  "kubernetes>=33.1",
  "libtmux>=0.37,<0.40",
  "litellm!=1.64.4,!=1.67.*,>=1.74.3",
  "memory-profiler>=0.61",
  "numpy",
  "openai==1.99.9",
  "openhands-aci==0.3.2",
  "opentelemetry-api>=1.33.1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.33.1",
  "pathspec>=0.12.1",
  "pexpect",
  "prompt-toolkit>=3.0.50",
  "protobuf>=5,<6",
  "psutil",
  "pygithub>=2.5",
  "pyjwt>=2.9",
  "python-dotenv",
  "python-frontmatter>=1.1",
  "python-json-logger>=3.2.1",
  "python-multipart",
  "python-socketio>=5.11.4",
  "pythonnet",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.9",
  "redis>=5.2,<7",
  "shellingham>=1.5.4",
  "sse-starlette>=2.1.3",
  "tenacity>=8.5,<10",
  "termcolor",
  "toml",
  "tornado",
  "types-toml",
  "uvicorn",
  "whatthepatch>=1.0.6",
  "zope-interface==7.2",
]

optional-dependencies.dev = [
  "build",
  "mypy==1.17",
  "pre-commit==4.2",
  "pytest>=8.4",
  "ruff==0.12.5",
  "types-setuptools",
]
optional-dependencies.evaluation = [
  "boto3-stubs[s3]>=1.37.19",
  "browsergym==0.13.3",
  "browsergym-miniwob==0.13.3",
  "browsergym-visualwebarena==0.13.3",
  "browsergym-webarena==0.13.3",
  "commit0",
  "datasets",
  "evaluate",
  "func-timeout",
  "gdown",
  "joblib",
  "matplotlib",
  "pyarrow==21",
  "retry",
  "seaborn",
  "streamlit",
  "swebench @ git+https://github.com/ryanhoangt/SWE-bench.git@fix-modal-patch-eval",
  "swegym @ git+https://github.com/SWE-Gym/SWE-Bench-Package.git",
  "sympy",
  "tabulate",
  "visualswebench @ git+https://github.com/luolin101/Visual-SWE-bench.git",
  "whatthepatch",
]
optional-dependencies.runtime = [
  "flake8",
  "jupyterlab",
  "notebook",
]
optional-dependencies.test = [
  "gevent>=24.2.1,<26",
  "pandas",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-forked",
  "pytest-playwright>=0.7",
  "pytest-timeout>=2.4",
  "pytest-xdist",
  "reportlab",
]
optional-dependencies.testgeneval = [
  "fuzzywuzzy>=0.18",
  "python-levenshtein>=0.26.1,<0.28",
  "rouge>=1.0.1",
  "tree-sitter-python>=0.23.6",
]
# Keep poetry-dynamic-versioning config as-is under tool. poetry-dynamic-versioning if needed by tooling.
optional-dependencies.third_party_runtimes = [
  "daytona>=0.24.2",
  "e2b-code-interpreter>=2",
  "modal>=0.66.26,<1.2",
  "runloop-api-client>=0.50",
]
urls.repository = "https://github.com/All-Hands-AI/OpenHands"
scripts.openhands = "openhands.cli.entry:main"

[tool.poetry-dynamic-versioning]
enable = true
style = "semver"

[tool.autopep8]
# autopep8 fights with mypy on line length issue
ignore = [ "E501" ]

[tool.black]
# prevent black (if installed) from changing single quotes to double quotes
skip-string-normalization = true

[tool.ruff]
lint.select = [ "D" ]
# ignore warnings for missing docstrings
lint.ignore = [ "D1" ]
lint.pydocstyle.convention = "google"

[tool.coverage.run]
concurrency = [ "gevent" ]
